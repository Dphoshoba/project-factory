<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word Count</title>
<style>
  html { color-scheme: light; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 560px; margin: 60px auto; color: #16232B; background: #ffffff; }
  textarea { width: 100%; height: 120px; font-size: 16px; padding: 10px; box-sizing: border-box; }
  #count { font-size: 20px; font-weight: 600; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Word count</h1>
  <label for="input">Text to count</label>
  <textarea id="input" placeholder="Type here..."></textarea>
  <div id="count" aria-live="polite">0 words</div>
  <script type="module" src="actions/app.js"></script>
</body>
</html>
